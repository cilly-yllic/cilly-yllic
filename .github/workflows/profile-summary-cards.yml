name: Profile Summary Cards

on:
  # main に push されたとき（生成物フォルダだけの変更は無視してループを防ぐ）
  push:
    branches: [main]
    paths-ignore:
      - "profile-summary-card-output/**"
  # 12 時間ごと
  schedule:
    - cron: "0 */12 * * *"
  # 手動実行
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-profile-summary-cards
    permissions:
      contents: write

    steps:
      # GitHub App のインストールトークンを毎回発行（1時間で失効・無期限鍵なのでローテーション不要）
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          # owner を指定すると、その owner でインストール済みの全リポジトリにアクセスできる
          # （リポジトリ横断の言語/コミット統計に必要）
          owner: ${{ github.repository_owner }}

      - uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}

      - uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        with:
          USERNAME: cilly-yllic
          BRANCH_NAME: "main"
          UTC_OFFSET: 9 # JST
          AUTO_PUSH: true
